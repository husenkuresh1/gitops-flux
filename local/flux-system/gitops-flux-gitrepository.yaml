# Tells Flux to read this repository. Applied by hand once; after that Flux manages it from Git.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-flux
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/husenkuresh1/gitops-flux
  ref:
    branch: main
