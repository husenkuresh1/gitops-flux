apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: currency
  namespace: currency
spec:
  interval: 1h
  chart:
    spec:
      chart: podinfo
      version: 6.*
      sourceRef:
        kind: HelmRepository
        name: chat
        namespace: flux-system
  values:
    replicaCount: 1
    ui:
      message: Hello from currency
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
