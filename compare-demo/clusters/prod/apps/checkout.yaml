apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkout
  namespace: shop
spec:
  interval: 5m
  timeout: 2m
  chart:
    spec:
      chart: podinfo
      version: "6.14.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    replicaCount: 1
    ui:
      message: "Checkout"
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
