apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: catalog
  namespace: shop
spec:
  interval: 5m
  timeout: 2m
  chart:
    spec:
      chart: podinfo
      version: "6.15.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    replicaCount: 3
    ui:
      message: "Catalog (production) - spring sale"
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    logLevel: info
    auth:
      apiToken: fake-prod-token-not-a-real-secret
