apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quotes
  namespace: quotes
spec:
  interval: 1h
  chart:
    spec:
      chart: podinfo
      version: 6.*
      sourceRef:
        kind: HelmRepository
        name: audit
        namespace: calendar
  values:
    replicaCount: 1
    ui:
      message: Hello from quotes
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
