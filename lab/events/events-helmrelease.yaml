apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: events
  namespace: events
spec:
  interval: 1h
  chart:
    spec:
      chart: podinfo
      version: 6.*
      sourceRef:
        kind: HelmRepository
        name: sensors
        namespace: events
  values:
    replicaCount: 1
    ui:
      message: Hello from events
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
