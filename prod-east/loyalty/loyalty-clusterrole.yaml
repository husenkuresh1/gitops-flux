apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loyalty
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loyalty
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loyalty
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
